name: Build Signed AAB for Play Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer and cython
        run: |
          python -m pip install "pip==24.0"
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build AAB with buildozer
        env:
          P4A_RELEASE_KEYSTORE: release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          yes | buildozer android release 2>&1 | tee build_output.log

      - name: Show error details if build failed
        if: failure()
        run: |
          echo "===== LINES CONTAINING FAILURE/ERROR ====="
          grep -n -i -E "FAILURE|BUILD FAILED|error:|Exception|Could not|Unable to" build_output.log | tail -n 100
          echo ""
          echo "===== LAST 150 LINES (for context) ====="
          tail -n 150 build_output.log

      - name: Upload full build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-release-build-log
          path: build_output.log

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-password-tool-aab
          path: bin/*.aab
          if-no-files-found: ignore
