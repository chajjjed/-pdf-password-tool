name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17 
        uses: actions/setup-java@v4 
        with: 
          distribution: 'temurin' java-version: '17'    

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer and cython
        run: |
          
          
          python -m pip install "pip==24.0"
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK with buildozer
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build_output.log

      - name: Show error details if build failed
        if: failure()
        run: |
          echo "===== LAST 300 LINES OF BUILD LOG ====="
          tail -n 300 build_output.log

      - name: Upload full build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: build_output.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-password-tool-apk
          path: bin/*.apk
